<!-- index.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gravitational Orbit Simulator</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <section id="app">
      <header class="section-top">
        <div id="header">Header</header>
      </header>
      <article class="section-bottom">
        <div class="inner-left">
          <canvas id="canvas"></canvas>
        </div>
        <div class="inner-right" id="sidebar">Sidebar</section>
      </article>
    </section>
    <div id="no-js-page">JavaScript is required to run this simulator</div>

    <noscript>
      <style>
        #app {
          display: none;
        }
        #no-js-page {
          display: block;
        }
      </style>
    </noscript>
  </body>
</html>
