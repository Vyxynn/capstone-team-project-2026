<!-- index.html -->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gravitational Orbit Simulator</title>
        <link rel="stylesheet" href="/src/styles/index.css" />
    </head>
    <body>
        <div id="app">
            <header id="header">
                <div id="headInfo">
                    <div id="headInfoTitle">
                        <img src="src/assets/icon.svg" />
                        <a
                            href="https://github.com/Vyxynn/capstone-team-project-2026"
                            target="_blank"
                            >Gravitational Orbit Simulator</a
                        >
                    </div>
                    <div>Sim Time</div>
                </div>
                <div id="headTime">
                    <div id="simStatus">Status</div>
                    <button id="simPauseToggle">Pause/Play</button>
                    <button id="speedSixteenthButton">1/16x</button>
                    <button id="speedOneButton">1x</button>
                    <button id="speedTwoButton">2x</button>
                    <button id="speedFiveButton">5x</button>
                    <button id="speedTenButton">10x</button>
                </div>
            </header>
            <canvas id="canvas"></canvas>
            <section id="sidebar">
                <div id="sidebarNav">
                    <button class="sidebarNavLink" id="sidebarNavCreate">Create</button>
                    <button class="sidebarNavLink" id="sidebarNavBodies">Bodies</button>
                </div>
                <div id="sidebarContent">
                    <form class="sidebarContentHolder" id="sidebarContentCreate">
                        <canvas id="createCanvas"></canvas>
                        <div class="inputDiv">
                            <label for="createName">Name: </label>
                            <input type="text" name="createName" id="createName" />
                        </div>

                        <div class="inputDiv">
                            <label for="createColor">Color: </label>
                            <input type="color" name="createColor" id="createColor" />
                            <input type="text" name="createColorInput" id="createColorInput" />
                        </div>

                        <div class="inputDiv">
                            <label for="createMass">Mass (x10^24 kg): </label>
                            <p class="rangeLabel">0</p>
                            <input type="range" name="createMassRange" id="createMassRange" />
                            <p class="rangeLabel">100</p>
                            <input type="number" name="createMassInput" id="createMassInput" />
                        </div>

                        <div class="inputDiv">
                            <label for="createRadius">Radius (px): </label>
                            <p class="rangeLabel">0</p>
                            <input type="range" name="createRadiusRange" id="createRadiusRange" />
                            <p class="rangeLabel">100</p>
                            <input type="number" name="createRadiusInput" id="createRadiusInput" />
                        </div>

                        <div class="initialVelocityDiv">
                            <label for="createInitialVelocity">Initial Velocity (AU/yr): </label>
                            <div id="createInitialVelocityInputsDiv">
                                <div class="createInitialVelocityInput">
                                    <label for="createInitialVX">VX: </label>
                                    <input type="number" name="createInitialVX" id="createInitialVX" />
                                </div>
                                <div class="createInitialVelocityInput">
                                    <label for="createInitialVY">VY: </label>
                                    <input type="number" name="createInitialVY" id="createInitialVY" />
                                </div>
                            </div>
                        </div>

                        <button type="submit">Place</button>
                    </form>
                </div>
            </section>
        </div>
        <div id="no-js-page">JavaScript is required to run this simulator</div>

        <noscript>
            <style>
                #app {
                    display: none;
                }
                #no-js-page {
                    display: block;
                }
            </style>
        </noscript>
    </body>
</html>
